name: CI

# Build-checks every push and pull request so broken code never reaches
# production. Actual deployment is handled by EdgeOne Pages' Git integration
# (see DEPLOYMENT.md) — this workflow only verifies the build is healthy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build
